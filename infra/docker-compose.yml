services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: polar
      POSTGRES_USER: polar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polar-local-password}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polar -d polar"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-polar}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-polar-local-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  api:
    build: { context: .., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql+psycopg://polar:${POSTGRES_PASSWORD:-polar-local-password}@postgres:5432/polar
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
    ports: ["8000:8000"]
    volumes: ["media_data:/srv/backend/media"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
  worker:
    build: { context: .., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: [../.env]
    volumes: ["media_data:/srv/backend/media"]
    environment:
      DATABASE_URL: postgresql+psycopg://polar:${POSTGRES_PASSWORD:-polar-local-password}@postgres:5432/polar
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
  web:
    build: { context: .., dockerfile: infra/web.Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
  minio_data:
  media_data:
