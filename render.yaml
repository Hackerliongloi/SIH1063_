services:
  - type: web
    name: polarapi
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: polarapi-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_DAYS
        value: "14"
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: STORAGE_BUCKET
        value: polar-assets
      - key: STORAGE_REGION
        value: us-east-1
      - key: LLM_PROVIDER
        value: fake
      - key: MODEL_NAME
        value: local-fake
      - key: MODEL_BASE_URL
        value: ""
      - key: MODEL_PATH
        value: ""
      - key: SOCIAL_WEBHOOK_ENABLED
        value: "false"
      - key: SOCIAL_WEBHOOK_URL
        sync: false
      - key: SOCIAL_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false

  - type: worker
    name: polarworker
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m app.worker
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: polarapi-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: SECRET_KEY
        fromService:
          type: web
          name: polarapi
          envVarKey: SECRET_KEY
      - key: STORAGE_BUCKET
        value: polar-assets
      - key: STORAGE_REGION
        value: us-east-1
      - key: SOCIAL_WEBHOOK_ENABLED
        value: "false"
      - key: SOCIAL_WEBHOOK_URL
        sync: false
      - key: SOCIAL_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false

databases:
  - name: polarapi-db
    databaseName: polar
    user: polar
    plan: free
    region: oregon
    postgresMajorVersion: "16"
